<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết thuốc — Demo giao diện</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="demo-banner">Bản demo giao diện — dữ liệu minh hoạ, chưa kết nối backend thật.</div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="home.html">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="9.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/>
              <line x1="9.5" y1="9.5" x2="14.5" y2="14.5"/>
            </svg>
          </span>
          Trợ lý An toàn Thuốc <span class="brand-sub">demo</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-link" href="home.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 11 8-6.5 8 6.5"/><path d="M6 9.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9.5"/><path d="M10 20v-6h4v6"/></svg>
          Trang chủ
        </a>
        <a class="sidebar-link is-active" href="drug-info.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.8-1.3-4-2-6.5-2v12c2.5 0 4.7.7 6.5 2 1.8-1.3 4-2 6.5-2v-12c-2.5 0-4.7.7-6.5 2Z"/><line x1="12" y1="6.5" x2="12" y2="18.5"/></svg>
          Thông tin thuốc
        </a>
        <a class="sidebar-link" href="interactions-drug.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><line x1="9.5" y1="9.5" x2="14.5" y2="14.5"/></svg>
          Tương tác thuốc
        </a>
        <a class="sidebar-link" href="interactions-food.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2s6.5 7 6.5 11.3a6.5 6.5 0 1 1-13 0C5.5 10.2 12 3.2 12 3.2Z"/></svg>
          Thuốc - Thực phẩm
        </a>
        <a class="sidebar-link" href="interactions-disease.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3.5l1.8-5 3 10 2-8 1.5 3H21"/></svg>
          Thuốc - Bệnh nền
        </a>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-section-title">Lịch sử tra cứu</div>
        <ul class="history-list" id="historyList"></ul>
      </div>

      <div class="sidebar-footer">
        <span class="user-avatar">NA</span>
        <div class="user-info">
          <div class="user-name">Nguyễn An</div>
          <div class="user-role">Người dùng demo</div>
        </div>
        <a class="sidebar-logout" href="index.html" aria-label="Đăng xuất">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M4 12h11.5"/><path d="m11.5 7.5 4.5 4.5-4.5 4.5"/></svg>
        </a>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <div class="app-main">
      <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Mở menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <span class="app-topbar-title">Chi tiết thuốc</span>
      </header>

      <main class="page" id="detailPage">
        <a class="btn btn-ghost detail-back" href="drug-info.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="4" y2="12"/><path d="m10 6-6 6 6 6"/></svg>
          Quay lại danh sách thuốc
        </a>

        <div id="detailContent"></div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initSidebarToggle();
    applySessionToSidebar();
    renderHistoryList(document.getElementById("historyList"));

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("d") || "";
    const drugName = Object.keys(DRUG_INFO).find((name) => slugifyDrugName(name) === slug);
    const detailContent = document.getElementById("detailContent");

    const SECTIONS = [
      { key: "dangBaoChe", title: "Dạng bào chế", icon: ICONS.pill },
      { key: "chiDinh", title: "Chỉ định", icon: ICONS.shieldCheck },
      { key: "chongChiDinh", title: "Chống chỉ định", icon: ICONS.alert },
      { key: "thanTrong", title: "Thận trọng", icon: ICONS.info },
      { key: "tacDungPhu", title: "Tác dụng không mong muốn", icon: ICONS.droplet },
      { key: "lieuDung", title: "Liều và cách dùng", icon: ICONS.clipboard },
      { key: "chuY", title: "Chú ý khi sử dụng", icon: ICONS.book },
      { key: "taiLieuThamKhao", title: "Tài liệu tham khảo", icon: ICONS.link },
    ];

    if (!drugName || !DRUG_DETAILS[drugName]) {
      document.title = "Không tìm thấy thuốc — Demo giao diện";
      detailContent.innerHTML = `
        <div class="empty-state">
          ${ICONS.pill}
          <p>Không tìm thấy thông tin cho thuốc này. Quay lại danh sách để chọn thuốc khác.</p>
        </div>`;
    } else {
      const info = DRUG_INFO[drugName];
      const detail = DRUG_DETAILS[drugName];
      document.title = `${drugName} — Demo giao diện`;

      const tabsHtml = SECTIONS.map((s) => `<a class="detail-tab" href="#${s.key}">${s.title}</a>`).join("");
      const sectionsHtml = SECTIONS.map(
        (s) => `
        <section class="detail-section" id="${s.key}">
          <h2>${s.icon}${s.title}</h2>
          <p>${escapeHtml(detail[s.key])}</p>
        </section>`
      ).join("");

      detailContent.innerHTML = `
        <div class="page-header">
          <h1>${escapeHtml(drugName)}</h1>
          <p>${escapeHtml(info.group)}</p>
        </div>
        <div class="detail-actions">
          <button type="button" class="btn btn-primary" data-go="interactions-drug.html">
            ${ICONS.pill}Tra tương tác với thuốc khác
          </button>
          <button type="button" class="btn btn-secondary" data-go="interactions-food.html">
            ${ICONS.droplet}Tra với thực phẩm
          </button>
          <button type="button" class="btn btn-secondary" data-go="interactions-disease.html">
            ${ICONS.pulse}Tra với bệnh nền
          </button>
        </div>
        <div class="detail-tabs">${tabsHtml}</div>
        <div>${sectionsHtml}</div>
      `;

      // Từ màn thông tin thuốc đi thẳng sang các màn tra cứu, mang theo thuốc đang xem.
      detailContent.querySelectorAll("[data-go]").forEach((button) => {
        button.addEventListener("click", () => {
          writeState({ prefillDrugs: [drugName] });
          window.location.href = button.dataset.go;
        });
      });
    }
  </script>
</body>
</html>
