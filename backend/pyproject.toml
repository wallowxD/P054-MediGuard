[project]
name = "medsafe"
version = "0.1.0"
description = "Medication Safety Copilot — RAG agent tra tương tác thuốc có nguồn"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    # Agent
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    # RAG
    "qdrant-client>=1.12.0",
    "google-genai>=1.0.0",
    "openai>=1.60.0",
    "pypdf>=5.1.0",
    "pymupdf>=1.25.0",
    "pillow>=10.0.0",
    "rapidfuzz>=3.10.0",      # khớp mờ tên thuốc tiếng Việt
    "unidecode>=1.3.8",       # bỏ dấu để đối chiếu CSV (không dấu) với JSON (có dấu)
    # Data
    "pandas>=2.2.0",
    # [asyncio] kéo theo greenlet — bắt buộc cho AsyncSession, thiếu nó SQLAlchemy
    # ném MissingGreenlet ngay lần await đầu tiên.
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",   # cùng driver cho cả sync (alembic) lẫn async (request path)
    "supabase>=2.0.0",
    # Auth
    "argon2-cffi>=23.1.0",      # hash mật khẩu; KHÔNG dùng bcrypt/sha256 tự chế
    "pyjwt>=2.10.0",            # ký access/refresh token
    "email-validator>=2.2.0",   # bắt buộc để Pydantic EmailStr hoạt động
    "google-auth>=2.35.0",      # verify Google ID Token — không tự decode JWT (ADR 0016)
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medsafe"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["medsafe"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# rootdir là `backend/`, nên ".." là repo root. Cần thiết vì
# tests/unit/domain/test_batch_ocr.py import từ package `scripts/` ở root; không có
# dòng này thì `uv run pytest` fail ngay ở bước collect với ModuleNotFoundError.
pythonpath = [".."]
