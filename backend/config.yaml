# Tham số RAG — KHÔNG chứa secret.
# Secret (API key, DB URL) nằm ở .env tại repo ROOT, đọc qua medsafe/config.py.
# Sửa file này không cần sửa code; mọi giá trị được nạp vào Settings lúc khởi động.

app:
  name: "Medication Safety Copilot"
  env: "development"

ingestion:
  drug_list_csv: "dataset/drug_list_bv_gtvt.csv"
  interactions_json: "dataset/drugtodrug.json"
  pdf_cache_dir: "data/hdsd_pdf"
  # PRD: trích thử 50 thuốc đo tỷ lệ dữ liệu hữu ích trước khi chạy toàn bộ 1073
  pilot_limit: 50

chunking:
  chunk_size: 800
  chunk_overlap: 120
  # Cắt theo ranh giới mục của tờ HDSD trước, hết cách mới cắt theo độ dài.
  # Cắt giữa câu làm mất tính "nguyên văn" của đoạn trích -> vi phạm luật số 1.
  respect_section_boundaries: true
  section_headers:
    - "TƯƠNG TÁC THUỐC"
    - "CHỐNG CHỈ ĐỊNH"
    - "THẬN TRỌNG"
    - "TÁC DỤNG KHÔNG MONG MUỐN"
    - "LIỀU DÙNG"

embeddings:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1536
  batch_size: 64

vectordb:
  provider: "chroma"
  persist_dir: "data/chroma"
  collections:
    hdsd_excerpts: "hdsd_excerpts"   # đoạn trích tờ HDSD
    drug_names: "drug_names"          # tên biệt dược / hoạt chất, phục vụ chuẩn hoá

retrieval:
  top_k: 5
  # Dưới ngưỡng này coi như KHÔNG tìm thấy -> trả "chưa có dữ liệu",
  # tuyệt đối không để LLM lấp chỗ trống.
  score_threshold: 0.35
  max_context_chars: 6000

normalization:
  # Tên tiếng Việt có/không dấu, biệt dược vs hoạt chất -> khớp mờ trước khi tra.
  fuzzy_threshold: 88
  strip_diacritics: true

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.0          # tra cứu, không sáng tác
  max_tokens: 1500
  vision_model: "gpt-4o"    # dùng cho trích xuất PDF HDSD và đọc ảnh đơn thuốc

logging:
  level: "INFO"
  file: "logs/app.log"
  json_format: true
