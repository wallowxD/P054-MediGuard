# Non-secret application and RAG settings.
# Secrets and deployment URLs live in the repository-root .env or platform secret store.
# Provider/model identifiers are configuration, never hardcoded in routes or graph nodes.

app:
  name: "Medication Safety Copilot"
  env: "development"

ingestion:
  drug_list_csv: "dataset/drug_list_bv_gtvt.csv"
  pdf_cache_dir: "data/hdsd_pdf"
  raw_ocr_bucket: "leaflet-ocr"
  # Measure the fixed 50-medicine pilot before expanding to the full catalog.
  pilot_limit: 50

storage:
  relational_provider: "supabase_postgres"
  object_provider: "supabase_storage"

auth:
  # Secret ký token nằm ở JWT_SECRET_KEY trong .env, không bao giờ đặt ở đây.
  algorithm: "HS256"
  # Access token ngắn hạn vì nó nằm trong JWT của NextAuth ở phía client.
  access_token_ttl_minutes: 30
  refresh_token_ttl_days: 14
  password_min_length: 8
  # Đăng ký công khai LUÔN tạo role này. Nâng lên PHARMACIST là thao tác thủ công
  # của admin — tự chọn role lúc đăng ký là lỗ hổng leo thang đặc quyền.
  self_signup_role: "PATIENT"

catalog:
  # Duyệt danh mục thuốc theo chữ cái (GET /api/v1/drugs).
  page_size_default: 40
  page_size_max: 100

chunking:
  chunk_size: 800
  chunk_overlap: 120
  # Prefer leaflet section boundaries; length splitting is the last resort.
  # Never alter source text while chunking.
  respect_section_boundaries: true
  section_headers:
    - "TƯƠNG TÁC THUỐC"
    - "CHỐNG CHỈ ĐỊNH"
    - "THẬN TRỌNG"
    - "TÁC DỤNG KHÔNG MONG MUỐN"
    - "LIỀU DÙNG"

embeddings:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1536
  batch_size: 64

vectordb:
  provider: "qdrant"
  url_env: "QDRANT_URL"
  api_key_env: "QDRANT_API_KEY"
  collections:
    hdsd_excerpts: "hdsd_excerpts"
  required_payload:
    - "evidence_version_id"
    - "drug_id"
    - "source_url"
    - "page"
    - "section"

retrieval:
  top_k: 5
  # Below this threshold, return an unavailable outcome. Never lower it to force a hit.
  score_threshold: 0.35
  max_context_chars: 6000

normalization:
  # Match Vietnamese names deterministically before any lookup.
  fuzzy_threshold: 88
  strip_diacritics: true

ocr:
  prescription:
    provider: "google_genai"
    model: "gemini-2.5-flash"
  leaflet:
    provider: "qwen_model_studio"
    model: "qwen-vl-ocr-2025-11-20"
    base_url_env: "DASHSCOPE_BASE_URL"

llm:
  provider: "openai"
  model: "gpt-4o"
  temperature: 0.0
  max_tokens: 1500
  allowed_uses:
    - "bounded_structured_extraction"
    - "source_grounded_presentation"

logging:
  level: "INFO"
  file: "logs/app.log"
  json_format: true
