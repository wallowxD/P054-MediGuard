; Cấu hình Alembic. KHÔNG đặt connection string ở đây — sqlalchemy.url được nạp từ
; DATABASE_URL trong .env tại repo root, xem backend/migrations/env.py.
;
; Chạy từ repository root:
;   make migrate                      -> alembic upgrade head
;   make migration m="add drug table" -> alembic revision --autogenerate

[alembic]
; %(here)s = thư mục chứa file ini này, nên lệnh chạy được từ bất kỳ CWD nào.
script_location = %(here)s/migrations
path_separator = os

; Tên file revision có timestamp để thứ tự trên GitHub khớp thứ tự áp dụng.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
