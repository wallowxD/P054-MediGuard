name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check backend/

      - name: Check formatting
        run: uv run ruff format --check backend/

      - name: Run tests
        run: uv run pytest backend/tests -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  gate-integrity:
    name: Gate đã nộp phải nguyên vẹn
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # gate/gate_1 đã submit — mọi thay đổi trong đó phải bị chặn ở CI,
      # kể cả đổi tên hay xoá file.
      - name: Kiểm tra gate/gate_1
        run: |
          count=$(git ls-files gate/gate_1 | wc -l | tr -d ' ')
          echo "gate/gate_1 có $count file"
          if [ "$count" -ne 4 ]; then
            echo "::error::gate/gate_1 phải có đúng 4 file đã nộp, đang có $count"
            exit 1
          fi

  frontend:
    name: Frontend — lint & build
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint frontend
        run: yarn lint

      - name: Build frontend
        run: yarn build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_ENVIRONMENT: test
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-only-not-a-real-secret
