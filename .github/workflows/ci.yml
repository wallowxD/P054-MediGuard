name: Pull Request Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"
  FORCE_COLOR: "1"

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify submitted GATE 1 checksums
        run: sha256sum --check .github/gate-1.sha256

      - name: Reject GATE 1 changes and whitespace errors in pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- gate/gate_1; then
            echo "::error::gate/gate_1 is submitted and immutable. Revert every change under this path."
            git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- gate/gate_1
            exit 1
          fi

          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Verify workspace ownership rules
        shell: bash
        run: |
          set -euo pipefail

          source_markdown="$(git ls-files backend frontend | grep -E '\.md$' || true)"
          if [[ -n "$source_markdown" ]]; then
            echo "::error::Markdown files must not be committed inside backend/ or frontend/."
            printf '%s\n' "$source_markdown"
            exit 1
          fi

          planning_mirrors="$(find planning -type f ! -name README.md -print)"
          if [[ -n "$planning_mirrors" ]]; then
            echo "::error::planning/ may contain only README.md; Jira owns delivery tracking."
            printf '%s\n' "$planning_mirrors"
            exit 1
          fi

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          NEXTAUTH_SECRET=ci-only-not-a-real-secret docker compose config --quiet

  backend:
    name: Backend lint, format, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python and uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint backend
        run: uv run ruff check backend/

      - name: Check backend formatting
        run: uv run ruff format --check backend/

      - name: Run backend tests
        run: uv run pytest backend/tests -v --tb=short --strict-markers
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key-not-a-real-secret

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned Yarn
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Lint frontend
        run: yarn lint

      - name: Build and type-check frontend
        run: yarn build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_ENVIRONMENT: test
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-only-not-a-real-secret
