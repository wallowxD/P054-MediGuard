services:
  backend:
    build:
      # context = repo root vì uv.lock nằm ở workspace root, không nằm trong backend/
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://medsafe:medsafe@db:5432/medsafe
    volumes:
      - ./data:/app/data
      - ./dataset:/app/dataset:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      # yarn.lock nằm trong frontend/ nên context này là đúng
      context: ./frontend
      args:
        # NEXT_PUBLIC_* nhúng vào bundle lúc BUILD, không đọc lúc chạy —
        # nên phải là build arg. Giá trị là URL trình duyệt gọi tới, tức
        # cổng đã publish ra host, không phải hostname nội bộ của compose.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      # Ngược lại, biến KHÔNG có tiền tố NEXT_PUBLIC_ là secret phía server,
      # đọc lúc chạy — đặt ở đây mới đúng, đừng đưa vào build arg.
      NEXTAUTH_URL: http://localhost:3000
      # Thiếu secret thì next-auth ném NO_SECRET và đá MỌI route về /signin,
      # kể cả landing page công khai. Dùng `:?` để compose báo lỗi ngay thay vì
      # dựng lên một stack hỏng âm thầm.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?chua set trong .env o repo root — xem .env.example}
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medsafe
      POSTGRES_PASSWORD: medsafe
      POSTGRES_DB: medsafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsafe"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
