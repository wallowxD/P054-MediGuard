# File nen, dung cho CA local lan VPS.
#
#   Local  : make up            (mac dinh -> localhost, publish ra 0.0.0.0)
#   VPS    : make prod-up       (nap them docker-compose.prod.yml -> Caddy + HTTPS)
#
# Moi gia tri deu lay tu `.env` o repo root — docker compose tu doc file do de thay the
# ${...} ben duoi. Khong hardcode URL o day nua: cung mot file compose phai chay duoc o
# hai moi truong, chi khac noi dung .env.
#
# ⚠️ Khong con service `db`. DATABASE_URL trong .env tro thang toi Supabase pooler; truoc
#    day compose ghi de bien nay ve postgres local, khien container noi chuyen voi mot
#    database KHAC han luc `make dev` — cung schema nhung khac du lieu.

services:
  backend:
    build:
      # context = repo root vì uv.lock nằm ở workspace root, không nằm trong backend/
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Prod đặt BIND_HOST=127.0.0.1 để chỉ Caddy trên cùng host gọi được, không
      # phơi 8000 ra Internet. Local để trống -> 0.0.0.0, gọi từ máy khác trong LAN được.
      - "${BIND_HOST:-0.0.0.0}:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./dataset:/app/dataset:ro
    restart: unless-stopped
    # healthcheck đã khai báo trong backend/Dockerfile, không lặp lại ở đây.

  frontend:
    build:
      # yarn.lock nằm trong frontend/ nên context này là đúng
      context: ./frontend
      args:
        # ★ NEXT_PUBLIC_* nhúng vào bundle lúc BUILD, không đọc lúc chạy — nên phải là
        #   build arg. Đặt ở `environment:` là vô tác dụng hoàn toàn.
        #   Giá trị là URL TRÌNH DUYỆT gọi tới (tức domain công khai hoặc cổng đã publish
        #   ra host), không phải hostname nội bộ của compose.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-development}
        # Thiếu client ID thì nút "Đăng nhập Google" hiện toast lỗi lúc chạy chứ không
        # fail lúc build — dùng `:?` để chặn ngay tại đây.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?chua set trong .env o repo root — xem .env.example}
    ports:
      - "${BIND_HOST:-0.0.0.0}:3000:3000"
    environment:
      # Ngược lại, biến KHÔNG có tiền tố NEXT_PUBLIC_ là secret hoặc cấu hình phía
      # server, đọc lúc chạy — đặt ở đây mới đúng, đừng đưa vào build arg.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # ★ URL backend dành cho code chạy TRONG container (authorize() của NextAuth).
      #   Bắt buộc dùng service name: `localhost:8000` ở trong container này trỏ về
      #   chính nó, không phải backend → đăng nhập hỏng mà backend không hề ghi log.
      #   Xem src/constants/api.ts -> apiBaseUrl().
      API_INTERNAL_URL: http://backend:8000
      # Thiếu secret thì next-auth ném NO_SECRET và đá MỌI route về /signin,
      # kể cả landing page công khai. Dùng `:?` để compose báo lỗi ngay thay vì
      # dựng lên một stack hỏng âm thầm.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?chua set trong .env o repo root — xem .env.example}
    depends_on:
      - backend
    restart: unless-stopped
